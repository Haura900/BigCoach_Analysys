<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10201c">
  <title>BigCoach Luck Analyzer 移行ページ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #15211f; background: #f3f0e8; font-family: "Yu Gothic UI", system-ui, sans-serif; }
    main { width: min(680px, 100%); padding: 38px; border: 1px solid #d8d6cc; border-radius: 18px; background: #fffdf8; box-shadow: 0 24px 70px rgba(25,49,42,.1); }
    .eyebrow { margin: 0; color: #12614f; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 7px 0 14px; font: 500 clamp(30px, 6vw, 48px)/1.2 Georgia, "Yu Mincho", serif; }
    p { color: #687571; line-height: 1.8; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    a, button { border: 0; border-radius: 8px; padding: 12px 16px; font: 700 12px inherit; cursor: pointer; text-decoration: none; }
    a { color: #fff; background: #12614f; }
    button { color: #12614f; background: #edf4ef; border: 1px solid rgba(18,97,79,.2); }
    button:disabled { color: #8b9591; cursor: default; }
    #status { margin: 16px 0 0; font-size: 11px; }
    small { display: block; margin-top: 24px; color: #7e8985; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">LUCK ANALYZER MOVED</p>
    <h1>Luck Analyzerを<br>別リポジトリへ移しました。</h1>
    <p>BigCoach Anki Studioとの混在を解消しました。今後は新しいLuck Analyzerをお使いください。</p>
    <div class="actions">
      <a href="https://haura900.github.io/BigCoach_Luck_Analyzer/">新しいLuck Analyzerを開く →</a>
      <button id="export-button">旧サイトの保存履歴をJSONで退避</button>
    </div>
    <p id="status" role="status"></p>
    <small>旧サイトで牌譜を保存していた場合は、先に「保存履歴をJSONで退避」を押してください。そのJSONは新サイトの「差分JSONを選んで解析」から読み込めます。ブックマークレットも新サイトから登録し直してください。</small>
  </main>
  <script>
    (() => {
      const key = "bigcoach-luck-analyzer:v2";
      const button = document.querySelector("#export-button");
      const status = document.querySelector("#status");
      let records = [];
      try { records = JSON.parse(localStorage.getItem(key) || "[]"); } catch { records = []; }
      if (!Array.isArray(records) || !records.length) {
        button.disabled = true;
        status.textContent = "この旧URLには保存履歴がありません。";
        return;
      }
      status.textContent = `旧サイトに${records.length}対局の保存履歴があります。`;
      button.addEventListener("click", () => {
        const payload = { kind: "bigcoach-luck-records", version: 2, exportedAt: new Date().toISOString(), records };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `bigcoach-luck-migration-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        status.textContent = `${records.length}対局を退避しました。新サイトでこのJSONを読み込んでください。`;
      });
    })();
  </script>
</body>
</html>
