<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigCoach Anki Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="panel">
    <header>
      <div>
        <h1>BigCoach Anki Studio</h1>
        <p id="browser-status" class="muted">gokujan.com を読み込み中...</p>
      </div>
      <div class="header-actions">
        <button id="settings-open" class="ghost" type="button">設定</button>
      </div>
    </header>

    <section>
      <h2>Ankiカード登録</h2>
      <label for="front-note">表面補足テキスト</label>
      <input id="front-note" type="text" placeholder="例: 終盤押し引き / 副露判断など">
      <label for="memo">解説用メモ</label>
      <textarea id="memo" rows="4" placeholder="後で思い出したい判断理由など"></textarea>
      <button id="preview-card" class="primary action" type="button">カード内容をプレビュー</button>
    </section>

    <section>
      <h2>解析済みURLを開く</h2>
      <div class="url-row">
        <input id="review-url" type="url" placeholder="https://gokujan.com/review/...">
        <button id="open-review-url" class="primary" type="button">開く</button>
      </div>
      <label>過去の解析結果
        <select id="review-history"><option value="">履歴を選択</option></select>
      </label>
    </section>

    <section class="scene-summary">
      <div class="section-title">
        <h2>現在の局面</h2>
        <button id="copy-hand-mpsz" class="ghost small" type="button" disabled>手牌mpszをコピー</button>
        <button id="refresh-scene" class="ghost small" type="button">局面を取得</button>
      </div>
      <div id="scene-title" class="scene-title">解析済み局面を表示して「局面を取得」を押してください</div>
      <div id="scene-chips" class="chips"></div>
      <div id="missing-info" class="notice hidden"></div>
    </section>

    <section>
      <div class="section-title">
        <h2>配牌スコア</h2>
        <button id="calculate-hand-score" class="ghost small" type="button">計算</button>
      </div>
      <div id="hand-score-result" class="hand-score empty">局面を取得してから計算してください</div>
    </section>

    <section>
      <h2>第一打データCSV</h2>
      <p class="muted">各局の第一打について、手牌mpsz・和了率・ドラ表示牌・被副露・被立直をCSVへ追記します。</p>
      <button id="stock-first-discards" class="primary action" type="button">各局第一打をCSVに保存</button>
      <div id="first-discard-stock-status" class="definition">未保存</div>
    </section>

    <section>
      <button id="run-simulation" class="primary action" type="button">何切るシミュレーターを実行</button>
      <div id="comparison" class="comparison"></div>
      <div class="tabs">
        <button class="tab active" data-tab="wall" type="button">河・副露を反映</button>
        <button class="tab" data-tab="plain" type="button">補正なし</button>
        <button class="tab" data-tab="bigcoach" type="button">BigCoach評価</button>
      </div>
      <div id="results" class="results empty">シミュレーター未実行</div>
    </section>
  </main>

  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h2>設定</h2>
      <label>Ankiデッキ名<input name="deckName" required></label>
      <label>Ankiノートタイプ<input name="modelName" required></label>
      <label>タグ（カンマ区切り）<input name="tags"></label>
      <div class="form-grid">
        <label>解析タイムアウト（秒）<input name="simulatorTimeoutSec" type="number" min="3" max="300"></label>
      </div>
      <fieldset>
        <legend>何切るシミュレーター</legend>
        <label><input name="enableRedDora" type="checkbox"> 赤ドラ</label>
        <label><input name="enableUraDora" type="checkbox"> 裏ドラ</label>
        <label><input name="enableShantenDown" type="checkbox"> シャンテン戻し</label>
        <label><input name="enableTegawari" type="checkbox"> 手変わり</label>
        <label><input name="enableRiichi" type="checkbox"> リーチ</label>
      </fieldset>
      <fieldset class="score-settings">
        <legend>配牌スコア計算</legend>
        <div class="form-grid score-grid">
          <label>ドラ1枚<input name="handScoreDoraSingle" type="number" step="1"></label>
          <label>ドラ対子・ダブドラ<input name="handScoreDoraPair" type="number" step="1"></label>
          <label>メンツ<input name="handScoreMentsu" type="number" step="1"></label>
          <label>リャンメンターツ<input name="handScoreRyanmen" type="number" step="1"></label>
          <label>カンチャンターツ<input name="handScoreKanchan" type="number" step="1"></label>
          <label>ペンチャンターツ<input name="handScorePenchan" type="number" step="1"></label>
          <label>役牌以外対子（2個目まで）<input name="handScoreNonYakuhaiPair" type="number" step="1"></label>
          <label>3つ目以降の対子<input name="handScoreExcessPair" type="number" step="1"></label>
          <label>役牌対子<input name="handScoreYakuhaiPair" type="number" step="1"></label>
          <label>親番<input name="handScoreDealerBonus" type="number" step="1"></label>
        </div>
      </fieldset>
      <menu>
        <button value="cancel" class="ghost">キャンセル</button>
        <button value="default" id="settings-save" class="primary">保存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="preview-dialog" class="wide">
    <div class="preview-header">
      <h2>カードプレビュー</h2>
      <button id="preview-close" class="ghost" type="button">閉じる</button>
    </div>
    <div id="duplicate-warning" class="notice hidden"></div>
    <div class="preview-columns">
      <article><h3>問題面</h3><div id="front-preview" class="card-preview"></div></article>
      <article><h3>解答面</h3><div id="back-preview" class="card-preview"></div></article>
    </div>
    <div class="register-row">
      <label>登録デッキ
        <select id="preview-deck"></select>
      </label>
      <label>重複時
        <select id="duplicate-mode">
          <option value="skip">スキップ</option>
          <option value="overwrite">既存カードを上書き</option>
          <option value="separate">別カードとして登録</option>
        </select>
      </label>
      <button id="register-card" class="primary" type="button">Ankiに登録</button>
    </div>
  </dialog>

  <div id="busy" class="busy hidden"><div class="spinner"></div><span id="busy-text">処理中...</span></div>
  <div id="toast" class="toast hidden"></div>
  <script src="renderer.js"></script>
</body>
</html>
